import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.dsl.KotlinVersion
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile
import org.jetbrains.kotlin.gradle.tasks.KotlinCompilerExecutionStrategy

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
if (rootProject.benchmarkBackend == 'kapt') {
    apply plugin: 'org.jetbrains.kotlin.kapt'
} else {
    apply plugin: 'com.google.devtools.ksp'
}
apply plugin: 'com.alibaba.arouter'

android {
    namespace 'com.alibaba.android.arouter.kspbenchmark'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.alibaba.android.arouter.kspbenchmark'
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName '1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    testOptions { animationsDisabled true }
}

kotlin {
    jvmToolchain(17)
    compilerOptions {
        jvmTarget = JvmTarget.JVM_1_8
        languageVersion = KotlinVersion.KOTLIN_2_3
        apiVersion = KotlinVersion.KOTLIN_2_3
    }
}

// This also configures kaptGenerateStubsDebugKotlin. Its actual options are
// inspected by benchmarkFingerprint, rather than inferred from the KGP version.
tasks.withType(KotlinCompile).configureEach {
    compilerExecutionStrategy = KotlinCompilerExecutionStrategy.IN_PROCESS
    compilerOptions {
        jvmTarget = JvmTarget.JVM_1_8
        languageVersion = KotlinVersion.KOTLIN_2_3
        apiVersion = KotlinVersion.KOTLIN_2_3
    }
}

if (rootProject.benchmarkBackend == 'kapt') {
    kapt {
        includeCompileClasspath = false
        arguments { arg('AROUTER_MODULE_NAME', 'benchmarkapp') }
    }
} else {
    ksp { arg('AROUTER_MODULE_NAME', 'benchmarkapp') }
}

dependencies {
    implementation "com.alibaba:arouter-api:${rootProject.property('arouter.api.version')}"
    if (rootProject.benchmarkBackend == 'kapt') {
        kapt "com.alibaba:arouter-compiler:${rootProject.property('arouter.compiler.version')}"
    } else {
        ksp "com.alibaba:arouter-compiler-ksp:${rootProject.property('arouter.ksp.compiler.version')}"
    }
    androidTestImplementation 'androidx.test:runner:1.3.0'
}
